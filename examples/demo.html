<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pig audio triage: live demo</title>
<style>
  :root { --g:#1f9d55; --y:#d69e00; --r:#d64545; --ink:#1d2330; --mute:#6b7280; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif; color:var(--ink); background:#f6f7f9; }
  header { padding:18px 28px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:18px; }
  header h1 { font-size:20px; margin:0; }
  header .srv { color:var(--mute); font-size:13px; margin-left:auto; font-family: ui-monospace, monospace; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#bbb; margin-right:6px; vertical-align:middle; }
  .dot.ok { background:var(--g); }
  main { padding:20px 28px; }
  .upload { background:#fff; border:2px dashed #c9cdd4; border-radius:10px; padding:16px 20px; display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .upload label { background:var(--ink); color:#fff; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
  .upload input { display:none; }
  .upload span { color:var(--mute); font-size:14px; }
  #cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; display:grid; grid-template-columns: 64px 1fr; gap:4px 14px; animation: in .25s ease-out; }
  @keyframes in { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }
  .light { grid-row: span 6; width:56px; height:56px; border-radius:50%; background:#e5e7eb; align-self:start; margin-top:2px; }
  .light.green { background:var(--g); box-shadow:0 0 0 5px #1f9d5522; }
  .light.yellow { background:var(--y); box-shadow:0 0 0 5px #d69e0022; }
  .light.red { background:var(--r); box-shadow:0 0 0 5px #d6454522; }
  .light.busy { background: conic-gradient(#9ca3af 0 25%, #e5e7eb 0); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .name { font-weight:600; font-size:14px; word-break:break-all; }
  .row { font-size:13px; color:#374151; }
  .row b { font-weight:600; }
  .tag { font-size:10.5px; background:#fff4d6; color:#8a6500; border-radius:4px; padding:1px 5px; margin-left:4px; }
  .bars { display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:4px; background:#eee; }
  .bars div { height:100%; }
  .legend { font-size:11px; color:var(--mute); margin-top:3px; }
  .meta { grid-column:2; font-size:11.5px; color:var(--mute); }
  .segs { display:flex; gap:3px; margin-top:4px; }
  .seg { flex:1; font-size:10.5px; text-align:center; padding:2px 0; border-radius:3px; color:#fff; }
</style>
</head>
<body>
<header>
  <h1>Pig respiratory audio triage: demo</h1>
  <div class="srv"><span id="dot" class="dot"></span><span id="srv"></span></div>
</header>
<main>
  <div class="upload">
    <label for="f">Choose recordings…</label>
    <input id="f" type="file" multiple accept="audio/*">
    <span>Each file is uploaded to <code>POST /analyze</code>. Results appear below as they come back.</span>
  </div>
  <div id="cards"></div>
</main>
<script>
const API = new URLSearchParams(location.search).get("api") || "http://localhost:8080";
document.getElementById("srv").textContent = API;
fetch(API + "/health").then(r => r.json()).then(h => {
  document.getElementById("dot").classList.add("ok");
  document.getElementById("srv").textContent = `${API} · model loaded · ${h.device}`;
});
const C = { no_breathing: "#9ca3af", normal: "#1f9d55", abnormal: "#d64545" };
const BT = { breathing: ["#7dd3c0", "breathing"], light_breathing: ["#c7e9b4", "light"], heavy_breathing: ["#2c7fb8", "heavy"], heavy_breathing_with_noises: ["#253494", "heavy + noise"] };
const TXT = { green: "Breathing sounds normal", yellow: "No clear breathing: please re-record", red: "Abnormal-sounding breathing: please check this pig" };

async function analyze(file) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="light busy"></div><div class="name">${file.name}</div><div class="row">analyzing…</div>`;
  document.getElementById("cards").appendChild(card);
  card.scrollIntoView({ behavior: "smooth", block: "end" });
  const fd = new FormData(); fd.append("file", file);
  const res = await fetch(API + "/analyze", { method: "POST", body: fd }).then(r => r.json());
  const b = res.breathing, d = res.disease, p = res.probabilities, bt = res.breathing_type;
  const btBlock = !bt.probabilities ? `<div class="legend">breathing type<span class="tag">experimental</span>: none (no breathing)</div>` :
    `<div class="bars">${Object.keys(BT).map(k => `<div style="width:${(bt.probabilities[k]*100).toFixed(1)}%;background:${BT[k][0]}"></div>`).join("")}</div>
     <div class="legend">breathing type<span class="tag">experimental</span>: <b>${BT[bt.type][1]}</b> · ${Object.keys(BT).map(k => `${BT[k][1]} ${bt.probabilities[k].toFixed(2)}`).join(" · ")}</div>`;
  const bars = Object.keys(C).map(k => `<div style="width:${(p[k]*100).toFixed(1)}%;background:${C[k]}"></div>`).join("");
  const segs = res.segments.map(s => {
    const col = !s.breathing ? C.no_breathing : (s.p_abnormal >= 0.25 ? C.abnormal : C.normal);
    return `<div class="seg" style="background:${col}">${s.start_s}–${s.end_s}s</div>`;
  }).join("");
  card.innerHTML = `
    <div class="light ${res.status}"></div>
    <div class="name">${file.name}</div>
    <div class="row"><b>${TXT[res.status]}</b></div>
    <div class="row">Breathing: <b>${b.status.replace("_", " ")}</b> (P=${b.p_breathing.toFixed(2)}, ${b.breathing_clips}/${b.total_clips} clips)
      &nbsp;·&nbsp; Disease<span class="tag">experimental</span>: <b>${d.status}</b>${d.p_abnormal === null ? "" : ` (P=${d.p_abnormal.toFixed(2)})`}</div>
    <div>
      <div class="bars">${bars}</div>
      <div class="legend">disease probabilities · no breathing ${p.no_breathing.toFixed(2)} · normal ${p.normal.toFixed(2)} · abnormal ${p.abnormal.toFixed(2)}</div>
      <div class="segs">${segs}</div>
    </div>
    <div>${btBlock}</div>
    <div class="meta">${res.duration_s} s audio · analyzed in ${res.processing_s} s</div>`;
}
document.getElementById("f").addEventListener("change", async e => {
  for (const file of e.target.files) await analyze(file);
});
</script>
</body>
</html>
